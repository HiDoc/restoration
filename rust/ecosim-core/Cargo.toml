[package]
name = "ecosim-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic ecological ECS simulation shared by native tests and the browser"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = 3
panic = "abort"
strip = true
